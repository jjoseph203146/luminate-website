<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Test Store Admin | Luminate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0D1B2E;--navy2:#0A1524;--ink:#F4F7FB;--dim:#C4D1E2;--dim2:#7E8DA0;--accent:#E8E2D4;--ok:#6FCF97;--warn:#F2C879;--err:#F2A0A0}
  *{box-sizing:border-box}
  body{margin:0;background:var(--navy);color:var(--ink);font:15px/1.6 Inter,system-ui,sans-serif;min-height:100vh}
  .banner{background:rgba(232,226,212,.10);border-bottom:1px solid rgba(232,226,212,.25);color:var(--accent);font-size:13px;text-align:center;padding:10px 16px}
  .wrap{max-width:1080px;margin:0 auto;padding:32px 20px 64px}
  h1{font:600 30px/1.1 'Playfair Display',serif;letter-spacing:-.03em;margin:0}
  .top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:24px}
  .actions{display:flex;gap:10px;flex-wrap:wrap}
  .btn{border:1px solid rgba(196,209,226,.25);border-radius:999px;background:transparent;color:var(--ink);font:500 13px Inter,sans-serif;padding:9px 18px;cursor:pointer;transition:transform .3s cubic-bezier(.2,.7,.2,1),border-color .25s,background-color .25s}
  .btn:hover{border-color:rgba(232,226,212,.6);background:rgba(232,226,212,.06);transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn:focus-visible,input:focus-visible,select:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(232,226,212,.45)}
  .btn.primary{background:var(--accent);color:var(--navy);border-color:transparent;font-weight:600}
  .btn[disabled]{opacity:.5;cursor:wait}
  input,select{background:var(--navy2);color:var(--ink);border:1px solid rgba(196,209,226,.25);border-radius:10px;padding:9px 12px;font:inherit}
  .login{max-width:380px;margin:80px auto;padding:28px;background:linear-gradient(160deg,#173052,#152A45);border:1px solid rgba(196,209,226,.12);border-radius:20px;box-shadow:0 34px 80px -34px rgba(0,0,0,.75)}
  .login h1{margin-bottom:16px}
  .login input{width:100%;margin-bottom:12px}
  .err{color:var(--err);font-size:13.5px;min-height:1.3em}
  .order{background:linear-gradient(160deg,#132743,#101F35);border:1px solid rgba(196,209,226,.09);border-radius:16px;padding:20px;margin-bottom:14px}
  .order-head{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;justify-content:space-between;margin-bottom:12px}
  .oid{font:600 17px 'Playfair Display',serif}
  .meta{color:var(--dim2);font-size:12.5px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{color:var(--dim2);font-weight:500;text-align:left;font-size:12px;padding:0 0 6px}
  td{padding:6px 0;border-top:1px solid rgba(196,209,226,.08);color:var(--dim)}
  td.n,th.n{text-align:right}
  .foot{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;margin-top:14px;padding-top:14px;border-top:1px solid rgba(196,209,226,.08)}
  .pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500;border:1px solid}
  .pill.sent{color:var(--ok);border-color:rgba(111,207,151,.4)}
  .pill.pending,.pill.sending,.pill.failed{color:var(--warn);border-color:rgba(242,200,121,.4)}
  .pill.dead{color:var(--err);border-color:rgba(242,160,160,.4)}
  .empty{color:var(--dim2);padding:40px 0;text-align:center}
  .small{font-size:12.5px;color:var(--dim2)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="banner"><strong>TEST MODE</strong> — sandbox orders only</div>

<div id="loginView" class="login" hidden>
  <h1>Test Store Admin</h1>
  <form id="loginForm">
    <label class="small" for="pw">Admin password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn primary" style="width:100%" type="submit">Sign in</button>
    <div class="err" id="loginErr" role="alert"></div>
  </form>
</div>

<main id="appView" class="wrap" hidden>
  <div class="top">
    <h1>Orders</h1>
    <div class="actions">
      <button class="btn" id="refresh" type="button">Refresh</button>
      <button class="btn" id="retryAll" type="button">Retry failed emails</button>
      <button class="btn" id="logout" type="button">Sign out</button>
    </div>
  </div>
  <div class="err" id="appErr" role="alert"></div>
  <div id="orders"></div>
</main>

<script>
(function () {
  var STATUSES = ['new', 'processing', 'shipped', 'delivered', 'cancelled'];
  var $ = function (id) { return document.getElementById(id); };

  function api(method, path, body) {
    return fetch(path, {
      method: method,
      credentials: 'same-origin',
      headers: body ? { 'Content-Type': 'application/json' } : {},
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, status: r.status, data: d }; }); });
  }
  function money(cents, cur) { return new Intl.NumberFormat('en-US', { style: 'currency', currency: (cur || 'usd').toUpperCase() }).format(cents / 100); }
  function el(tag, props, children) {
    var n = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) { if (k === 'text') n.textContent = props[k]; else if (k === 'class') n.className = props[k]; else n.setAttribute(k, props[k]); });
    (children || []).forEach(function (c) { n.appendChild(c); });
    return n;
  }

  function show(authed) { $('loginView').hidden = authed; $('appView').hidden = !authed; if (authed) load(); }

  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    $('loginErr').textContent = '';
    api('POST', '/api/test-store/admin/session', { password: $('pw').value }).then(function (r) {
      if (r.ok) { $('pw').value = ''; show(true); }
      else $('loginErr').textContent = r.status === 429 ? 'Too many attempts. Try again later.' : 'Wrong password.';
    });
  });
  $('logout').addEventListener('click', function () { api('DELETE', '/api/test-store/admin/session').then(function () { show(false); }); });
  $('refresh').addEventListener('click', load);
  $('retryAll').addEventListener('click', function () {
    var b = $('retryAll'); b.disabled = true;
    api('POST', '/api/test-store/retry-notifications', {}).then(function (r) {
      b.disabled = false;
      $('appErr').textContent = r.ok ? '' : 'Retry failed (' + r.status + ').';
      load();
    });
  });

  function render(orders) {
    var root = $('orders');
    root.textContent = '';
    if (!orders.length) { root.appendChild(el('div', { class: 'empty', text: 'No orders yet. Place a test order from /test-store.' })); return; }
    orders.forEach(function (o) {
      var items = o.items || [];
      var n = Array.isArray(o.notification) ? o.notification[0] : o.notification;

      var table = el('table', {}, [
        el('thead', {}, [el('tr', {}, [el('th', { text: 'Product' }), el('th', { class: 'n', text: 'Qty' }), el('th', { class: 'n', text: 'Amount' })])]),
        el('tbody', {}, items.map(function (i) {
          return el('tr', {}, [el('td', { text: i.name }), el('td', { class: 'n', text: String(i.quantity) }), el('td', { class: 'n', text: money(i.amount_total, o.currency) })]);
        }))
      ]);

      var select = el('select', { 'aria-label': 'Fulfillment status' });
      STATUSES.forEach(function (s) { var opt = el('option', { value: s, text: s }); if (s === o.fulfillment_status) opt.selected = true; select.appendChild(opt); });
      select.addEventListener('change', function () {
        select.disabled = true;
        api('PATCH', '/api/test-store/admin/orders', { id: o.id, fulfillment_status: select.value }).then(function (r) {
          select.disabled = false;
          if (!r.ok) { $('appErr').textContent = 'Could not update status.'; load(); }
        });
      });

      var notifState = n ? n.status : 'none';
      var notifText = n ? ('Email ' + n.status + (n.attempts ? ' · ' + n.attempts + ' attempt' + (n.attempts === 1 ? '' : 's') : '')) : 'No email record';
      var notifBox = el('div', {}, [el('span', { class: 'pill ' + notifState, text: notifText })]);
      if (n && n.last_error && n.status !== 'sent') notifBox.appendChild(el('div', { class: 'small', text: 'Last error: ' + n.last_error }));
      if (n && n.status !== 'sent') {
        var rb = el('button', { class: 'btn', type: 'button', text: 'Retry email now' });
        rb.addEventListener('click', function () {
          rb.disabled = true;
          api('POST', '/api/test-store/admin/orders', { id: o.id }).then(function () { load(); });
        });
        notifBox.appendChild(rb);
      }

      var customer = (o.customer_name || 'Customer') + (o.customer_email ? ' · ' + o.customer_email : '');
      root.appendChild(el('article', { class: 'order' }, [
        el('div', { class: 'order-head' }, [
          el('div', { class: 'oid', text: 'Order #' + o.id.slice(0, 8) }),
          el('div', { class: 'meta', text: new Date(o.created_at).toLocaleString() + ' · ' + customer })
        ]),
        table,
        el('div', { class: 'foot' }, [
          el('div', {}, [el('div', { class: 'small', text: 'Total' }), el('strong', { text: money(o.amount_total, o.currency) })]),
          el('div', {}, [el('div', { class: 'small', text: 'Fulfillment' }), select]),
          notifBox
        ])
      ]));
    });
  }

  function load() {
    api('GET', '/api/test-store/admin/orders').then(function (r) {
      if (r.status === 401) return show(false);
      if (!r.ok) { $('appErr').textContent = 'Could not load orders. Check the Vercel logs and your Supabase settings.'; return; }
      $('appErr').textContent = '';
      render(r.data.orders || []);
    });
  }

  api('GET', '/api/test-store/admin/session').then(function (r) { show(!!(r.data && r.data.authed)); });
})();
</script>
</body>
</html>
